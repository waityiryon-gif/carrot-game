<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>당근 농장 10 만들기</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            background-color: #1e1e1e;
        }

        .phone-screen {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        .bg-illustration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .top-area {
            height: 26%;
            width: 100%;
            padding: 18px 14px 0 14px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            z-index: 10;
        }

        .header-boxes {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 8px;
            margin-top: 8px;
        }

        .ui-box {
            background-color: #f7eedc;
            border: 2.5px solid #6e472b;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #52331d;
            position: relative;
        }

        .btn-exit {
            flex: 0.75;
            padding: 6px 4px;
            font-weight: 800;
            color: #4a2e1b;
            font-size: 0.88rem;
            line-height: 1.2;
            cursor: pointer;
            text-align: center;
        }
        .btn-exit:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #52331d;
        }

        .stat-box {
            flex: 1.25;
            padding: 12px 5px 5px 5px;
        }

        .stat-label {
            position: absolute;
            top: -11px;
            background-color: #593822;
            color: #fff;
            font-size: 0.76rem;
            font-weight: bold;
            padding: 2px 12px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .stat-value {
            font-size: 1.65rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                -1.5px -1.5px 0 #593822,  
                 1.5px -1.5px 0 #593822,
                -1.5px  1.5px 0 #593822,
                 1.5px  1.5px 0 #593822,
                 0px    2.5px 0 #593822;
        }

        .field-area {
            height: 74%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            touch-action: none;
            padding-bottom: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 40px);
            grid-template-rows: repeat(10, 44px);
            column-gap: 10px;
            row-gap: 7px;
            place-items: center;
            justify-content: center;
            align-content: center;
        }

        @media (max-height: 720px) {
            .grid {
                grid-template-columns: repeat(6, 35px);
                grid-template-rows: repeat(10, 38px);
                column-gap: 8px;
                row-gap: 5px;
            }
        }

        .carrot {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 30%, #ff9f38, #e05a00 85%);
            border-radius: 48% 48% 44% 44%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 900;
            text-shadow: 0 1.5px 2px rgba(90, 30, 0, 0.75);
            box-shadow: 
                inset 0 -3px 5px rgba(120, 35, 0, 0.45),
                inset 0 2px 3px rgba(255, 220, 170, 0.5),
                0 3px 3px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: transform 0.08s;
        }

        .carrot::before {
            content: '';
            position: absolute;
            top: -5px;
            width: 16px;
            height: 7px;
            background: radial-gradient(circle at 50% 80%, #52b728, #2b7a0b);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 1px 1px rgba(0,0,0,0.35);
            z-index: -1;
        }

        .carrot.selected {
            background: radial-gradient(circle at 35% 30%, #ffe66d, #ff9500);
            transform: scale(0.92);
            box-shadow: 0 0 10px #fff36b, inset 0 0 4px rgba(0,0,0,0.3);
            z-index: 20;
        }

        .carrot.cleared {
            visibility: hidden;
            opacity: 0;
            transform: scale(0);
        }

        #selection-box {
            position: absolute;
            border: 2.5px dashed #fff;
            background-color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            display: none;
            border-radius: 8px;
            z-index: 100;
        }

        /* 대기 화면 스타일 */
        .start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(25, 15, 5, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: white;
            text-align: center;
            padding: 30px 20px;
            z-index: 300;
            overflow-y: auto;
        }

        .start-screen h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff9f1c;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 6px;
        }

        .start-screen p {
            font-size: 0.9rem;
            color: #f7eedc;
            margin-bottom: 16px;
        }

        /* 오늘의 기록 10개 목록 창 */
        .history-box {
            width: 100%;
            max-width: 320px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #6e472b;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffe66d;
            margin-bottom: 6px;
        }

        .history-list {
            list-style: none;
            font-size: 0.85rem;
            color: #ddd;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .history-item:last-child {
            border-bottom: none;
        }

        .btn-main {
            padding: 12px 32px;
            font-size: 1.1rem;
            background-color: #ff6b00;
            color: white;
            border: 2px solid #fff;
            border-radius: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #b34700;
            margin-bottom: 15px;
        }
        .btn-main:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b34700;
        }

        .game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(25, 15, 5, 0.88);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 0 20px;
            z-index: 200;
        }

        .special-message {
            margin-top: 10px;
            padding: 10px 14px;
            background: linear-gradient(135deg, #ff9f1c, #ff5400);
            border: 2px solid #ffe66d;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 900;
            line-height: 1.4;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .game-over button {
            margin-top: 16px;
            padding: 10px 24px;
            font-size: 1rem;
            background-color: #ff6b00;
            color: white;
            border: 2px solid #fff;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b34700;
        }
    </style>
</head>
<body>

    <div class="top-area">
        <div class="header-boxes">
            <div class="ui-box btn-exit" onclick="returnToStart()">
                🏠<br>메인으로
            </div>
            <div class="ui-box stat-box">
                <div class="stat-label">판매수</div>
                <div class="stat-value" id="score-board">0</div>
            </div>
            <div class="ui-box stat-box">
                <div class="stat-label">남은 시간</div>
                <div class="stat-value" id="timer">1:00</div>
            </div>

    <div class="field-area" id="gameContainer">
        <div class="grid" id="grid"></div>
        <div id="selection-box"></div>
    </div>

    <!-- 대기 화면 (Start Screen) -->
    <div class="start-screen" id="startScreen">
        <h1>🥕 당근 농장 10</h1>
        <p>합이 10이 되는 당근들을 드래그해서<br>제한 시간 1분 동안 최대한 많이 수확하세요!</p>
        
        <button class="btn-main" onclick="startGame()">당근 수확 시작하기</button>

        <!-- 오늘 기록 10개 목록 박스 -->
        <div class="history-box">
            <div class="history-title">📋 오늘의 도전 기록 (최신 10개)</div>
            <ul class="history-list" id="historyList">
                <!-- 자바스크립트로 동적 생성 -->
            </ul>
        </div>
    </div>

    <!-- 게임 종료 화면 -->
    <div class="game-over" id="gameOverModal">
        <h2>수확 종료!</h2>
        <p id="finalScore" style="font-size: 1.25rem; margin-top: 8px; font-weight: bold;">총 판매수: 0개</p>
        <p id="dailyBestScore" style="font-size: 1rem; margin-top: 4px; color: #ffe66d; font-weight: bold;">오늘의 최고 기록: 0개</p>
        <div id="specialMessage" class="special-message"></div>
        <button onclick="startGame()">한 판 더 하기</button>

<script>
    const ROWS = 10;
    const COLS = 6;
    const GAME_DURATION = 60; // 1분 (60초)
    
    const NUMBER_WEIGHTS = [
        { num: 1, weight: 16 },
        { num: 2, weight: 16 },
        { num: 3, weight: 15 },
        { num: 4, weight: 14 },
        { num: 5, weight: 11 },
        { num: 6, weight: 8 },
        { num: 7, weight: 7 },
        { num: 8, weight: 7 },
        { num: 9, weight: 6 }
    ];

    let gridData = [];
    let score = 0;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let isPlaying = false;

    let startX = 0, startY = 0, endX = 0, endY = 0;
    let isDragging = false;

    const gridElement = document.getElementById('grid');
    const scoreBoard = document.getElementById('score-board');
    const timerElement = document.getElementById('timer');
    const selectionBox = document.getElementById('selection-box');
    const gameContainer = document.getElementById('gameContainer');
    const gameOverModal = document.getElementById('gameOverModal');
    const specialMessage = document.getElementById('specialMessage');
    const dailyBestScoreElement = document.getElementById('dailyBestScore');
    const startScreen = document.getElementById('startScreen');
    const historyListElement = document.getElementById('historyList');

    function getTodayString() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // 오늘의 기록 목록 불러오기 (최대 10개, 자정 지나면 리셋)
    function getStoredHistory() {
        const today = getTodayString();
        const savedData = JSON.parse(localStorage.getItem('carrot_daily_history') || '{"date":"","list":[]}');
        if (savedData.date !== today) {
            return [];
        }
        return savedData.list;
    }

    // 기록 추가하기 (최신순으로 최대 10개 유지)
    function addRecord(currentScore) {
        const today = getTodayString();
        let list = getStoredHistory();

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        // 새 기록 추가 (가장 위로)
        list.unshift({ time: timeStr, score: currentScore });

        // 최대 10개까지만 유지
        if (list.length > 10) {
            list = list.slice(0, 10);
        }

        localStorage.setItem('carrot_daily_history', JSON.stringify({ date: today, list: list }));
        return list;
    }

    // 대기 화면에 기록 10개 렌더링하기
    function renderHistoryUI() {
        const list = getStoredHistory();
        historyListElement.innerHTML = '';

        if (list.length === 0) {
            const li = document.createElement('li');
            li.style.textAlign = 'center';
            li.style.color = '#aaa';
            li.style.padding = '8px 0';
            li.innerText = '오늘 아직 도전 기록이 없습니다!';
            historyListElement.appendChild(li);
            return;
        }

        list.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `<span>${index + 1}회차 (${item.time})</span> <strong>${item.score}개</strong>`;
            historyListElement.appendChild(li);
        });
    }

    // 오늘의 최고 기록 계산
    function getTodayBest() {
        const list = getStoredHistory();
        if (list.length === 0) return 0;
        return Math.max(...list.map(item => item.score));
    }

    function getWeightedRandomNumber() {
        const totalWeight = NUMBER_WEIGHTS.reduce((sum, item) => sum + item.weight, 0);
        let random = Math.random() * totalWeight;
        
        for (let i = 0; i < NUMBER_WEIGHTS.length; i++) {
            if (random < NUMBER_WEIGHTS[i].weight) {
                return NUMBER_WEIGHTS[i].num;
            }
            random -= NUMBER_WEIGHTS[i].weight;
        }
        return 1;
    }

    function returnToStart() {
        if (timerInterval) clearInterval(timerInterval);
        isPlaying = false;
        gameOverModal.style.display = 'none';
        renderHistoryUI();
        startScreen.style.display = 'flex';
    }

    function startGame() {
        startScreen.style.display = 'none';
        gameOverModal.style.display = 'none';
        specialMessage.style.display = 'none';
        score = 0;
        timeLeft = GAME_DURATION;
        scoreBoard.innerText = score;
        updateTimerText();
        
        initGrid();
        renderGrid();

        if (timerInterval) clearInterval(timerInterval);
        isPlaying = true;
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerText();
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function updateTimerText() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        timerElement.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function initGrid() {
        gridData = [];
        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                row.push(getWeightedRandomNumber());
            }
            gridData.push(row);
        }
    }

    function renderGrid() {
        gridElement.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const carrot = document.createElement('div');
                carrot.className = `carrot ${gridData[r][c] === 0 ? 'cleared' : ''}`;
                carrot.dataset.row = r;
                carrot.dataset.col = c;
                carrot.innerText = gridData[r][c] !== 0 ? gridData[r][c] : '';
                gridElement.appendChild(carrot);
            }
        }
    }

    function getClientCoords(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    function handleStart(e) {
        if (!isPlaying) return;
        isDragging = true;
        const coords = getClientCoords(e);
        const rect = gameContainer.getBoundingClientRect();
        startX = coords.x - rect.left;
        startY = coords.y - rect.top;
        
        selectionBox.style.left = `${startX}px`;
        selectionBox.style.top = `${startY}px`;
        selectionBox.style.width = `0px`;
        selectionBox.style.height = `0px`;
        selectionBox.style.display = 'block';
        updateSelection(startX, startY, startX, startY);
    }

    function handleMove(e) {
        if (!isDragging || !isPlaying) return;
        const coords = getClientCoords(e);
        const rect = gameContainer.getBoundingClientRect();
        endX = coords.x - rect.left;
        endY = coords.y - rect.top;

        let left = Math.min(startX, endX);
        let top = Math.min(startY, endY);
        let width = Math.abs(endX - startX);
        let height = Math.abs(endY - startY);

        selectionBox.style.left = `${left}px`;
        selectionBox.style.top = `${top}px`;
        selectionBox.style.width = `${width}px`;
        selectionBox.style.height = `${height}px`;

        updateSelection(left, top, left + width, top + height);
    }

    function handleEnd() {
        if (!isDragging || !isPlaying) return;
        isDragging = false;
        selectionBox.style.display = 'none';
        checkAndClearCarrots();
        clearHighlights();
    }

    gameContainer.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    gameContainer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleStart(e);
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (isDragging) e.preventDefault();
        handleMove(e);
    }, { passive: false });
    window.addEventListener('touchend', handleEnd);

    function updateSelection(x1, y1, x2, y2) {
        const carrots = document.querySelectorAll('.carrot');
        const parentRect = gameContainer.getBoundingClientRect();
        carrots.forEach(carrot => {
            const rect = carrot.getBoundingClientRect();
            const cLeft = rect.left - parentRect.left;
            const cTop = rect.top - parentRect.top;
            const cRight = cLeft + rect.width;
            const cBottom = cTop + rect.height;

            if (cRight >= x1 && cLeft <= x2 && cBottom >= y1 && cTop <= y2) {
                if (gridData[carrot.dataset.row][carrot.dataset.col] !== 0) {
                    carrot.classList.add('selected');
                }
            } else {
                carrot.classList.remove('selected');
            }
        });
    }

    function clearHighlights() {
        document.querySelectorAll('.carrot').forEach(c => c.classList.remove('selected'));
    }

    function checkAndClearCarrots() {
        const selectedCarrots = document.querySelectorAll('.carrot.selected');
        let sum = 0;
        let coordsList = [];

        selectedCarrots.forEach(carrot => {
            let r = parseInt(carrot.dataset.row);
            let c = parseInt(carrot.dataset.col);
            sum += gridData[r][c];
            coordsList.push({ r, c });
        });

        if (sum === 10 && coordsList.length > 0) {
            coordsList.forEach(pos => {
                gridData[pos.r][pos.c] = 0;
            });
            score += coordsList.length;
            scoreBoard.innerText = score;
            renderGrid();
        }
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        
        // 기록 저장 및 최신 10개 목록 갱신
        addRecord(score);
        const dailyBest = getTodayBest();

        document.getElementById('finalScore').innerText = `총 판매수: ${score}개`;
        dailyBestScoreElement.innerText = `오늘의 최고 기록: ${dailyBest}개`;
        
        let message = "";
        if (score < 30) {
            message = "허접이시네요!!<br>좀 더 분발하세요.";
        } else if (score < 40) {
            message = "아쉬워요.혹시 님은 허접??<br>조금 더 노력해보세요.";
        } else if (score < 50) {
            message = "아.. 큼.. 흠..<br>아쉬운데...";
        } else {
            message = "김은지님은 당근의 왕!!!<br>참 잘했어요!!";
        }
        
        specialMessage.innerHTML = message;
        specialMessage.style.display = 'block';
        
        gameOverModal.style.display = 'flex';
    }

    // 최초 접속 시 대기화면의 기록 목록 렌더링
    window.addEventListener('DOMContentLoaded', () => {
        renderHistoryUI();
    });
</script>
</body>
</html>
